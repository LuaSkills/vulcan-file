name: vulcan-file
version: 0.1.5
debug: false
help:
  main:
    description: Help agents decide when to use vulcan-file instead of CodeKit, rg, or shell snippets.
    file: help/help.md
  topics:
    - name: create
      description: Create one brand-new file with preview-first behavior.
      file: help/create.md
    - name: read
      description: Read one or more raw text snippets when the file path and approximate line area are known.
      file: help/read.md
    - name: list
      description: Find candidate files cheaply before reading them.
      file: help/list.md
    - name: edit
      description: Make small preview-first text edits after target lines have been inspected.
      file: help/edit.md
entries:
  - name: create
    description: "[AI FILE CREATE] Use when you want to create one brand-new file with preview-first semantics. It errors when the target file already exists and returns a host change_set when supported."
    lua_entry: runtime/vulcan-file-create.lua
    lua_module: vulcan_file_create
    help: create
    input_schema_file: schemas/create.input.schema.json
  - name: read
    description: "[AI FILE READ] Use when you already know the target file and line area and need exact source text. Prefer segments as an array of {start, count} objects; keep lines_rule only for legacy clients that cannot send arrays. Do not use this to search; use codekit-rg first."
    lua_entry: runtime/vulcan-file-read.lua
    lua_module: vulcan_file_read
    help: read
    input_schema_file: schemas/read.input.schema.json
  - name: list
    description: "[AI FILE LIST] Use before reading when you need to find candidate files cheaply. Prefer this over shell directory loops for a compact ignored-aware file map. Use codekit tools instead when you need AST structure."
    lua_entry: runtime/vulcan-file-list.lua
    lua_module: vulcan_file_list
    help: list
    input_schema_file: schemas/list.input.schema.json
  - name: edit
    description: "[AI FILE EDIT] Use for small text edits after you have read the target lines. It previews by default; pass apply=true only after the preview matches the intended change."
    lua_entry: runtime/vulcan-file-edit.lua
    lua_module: vulcan_file_edit
    help: edit
    input_schema_file: schemas/edit.input.schema.json
